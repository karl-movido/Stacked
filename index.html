<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="style.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
			rel="stylesheet"
		/>
		<title>Stacked</title>
	</head>
	<body>
		<header>
			<div class="header-inner">
				<div class="brand">
					<div class="logo-icon"><img src="books.png" alt="books" /></div>
					<div class="logo-text">
						<h1>Stacked</h1>
						<p>Your reading library</p>
					</div>
				</div>
				<div class="header-actions">
					<div class="search-wrap">
						<i data-lucide="search"></i>
						<input type="text" id="search-input" placeholder="Search title or author..." />
					</div>
					<button class="btn btn-primary" id="add-book">
						<i data-lucide="plus"></i>
						Add a book
					</button>
				</div>
			</div>
		</header>

		<div class="add-panel hidden" id="add-panel">
			<form action="" class="add-panel-inner">
				<div class="field">
					<label for="titleInput">Title</label>
					<input type="text" id="titleInput" placeholder="e.g. Harry potter" required />
				</div>
				<div class="field">
					<label for="authorInput">Author</label>
					<input type="text" id="authorInput" placeholder="e.g. J.K. Rowling" required />
				</div>
				<div class="field">
					<label for="pagesInput">Pages</label>
					<input type="number" id="pagesInput" min="1" placeholder="364" required />
				</div>
				<div class="field">
					<label for="statusInput">Status</label>
					<select name="status" id="statusInput" required>
						<option value="to-read" selected>To read</option>
						<option value="reading">Reading</option>
						<option value="done">Done</option>
					</select>
				</div>
				<div class="field">
					<label for="pagesRead">Pages Read</label>
					<input type="number" id="pagesRead" min="1" placeholder="120" required />
				</div>
				<button type="button" class="btn btn-primary" id="add-to-shelf">Add to shelf</button>
				<button type="button" class="btn btn-ghost" id="add-cancel">Cancel</button>
			</form>
		</div>

		<main>
			<nav class="filter-bar" id="filter-bar">
				<div class="filter-bar-inner">
					<button class="filter-tab active" data-view="all">
						All books <span class="count" id="allCounter">0</span>
					</button>
					<button class="filter-tab" data-view="pinned">
						Favorites <span class="count" id="pinnedCounter">0</span>
					</button>
					<button class="filter-tab" data-view="reading">
						Reading <span class="count" id="readingCounter">0</span>
					</button>
					<button class="filter-tab" data-view="to-read">
						To be read <span class="count" id="tbrCounter">0</span>
					</button>
					<button class="filter-tab" data-view="done">Done <span class="count" id="doneCounter">0</span></button>
				</div>
			</nav>
			<div class="shelf" id="shelf"></div>
		</main>

		<footer>
			<p>
				Copyright &copy; karl-movido
