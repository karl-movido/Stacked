<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="style.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
			rel="stylesheet"
		/>
		<title>Stacked</title>
	</head>
	<body>
		<header>
			<div class="header-inner">
				<div class="brand">
					<div class="logo-icon"><img src="books.png" alt="books" /></div>
					<div class="logo-text">
						<h1>Stacked</h1>
						<p>Your reading library</p>
					</div>
				</div>
				<div class="header-actions">
					<div class="search-wrap">
						<i data-lucide="search"></i>
						<input type="text" placeholder="Search title or author" />
					</div>
					<button class="btn btn-primary" id="add-book">
						<i data-lucide="plus"></i>
						Add a book
					</button>
				</div>
			</div>
		</header>

		<div class="add-panel hidden" id="add-panel">
			<form action="" class="add-panel-inner">
				<div class="field">
					<label for="titleInput">Title</label>
					<input type="text" id="titleInput" placeholder="e.g. Harry potter" required />
				</div>
				<div class="field">
					<label for="authorInput">Author</label>
					<input type="text" id="authorInput" placeholder="e.g. J.K. Rowling" required />
				</div>
				<div class="field">
					<label for="pagesInput">Pages</label>
					<input type="number" id="pagesInput" min="1" placeholder="364" required />
				</div>
				<div class="field">
					<label for="statusInput">Status</label>
					<select name="status" id="statusInput" required>
						<option value="to-read" selected>To read</option>
						<option value="reading">Reading</option>
						<option value="done">Done</option>
					</select>
				</div>
				<div class="field">
					<label for="pagesRead">Pages Read</label>
					<input type="number" id="pagesRead" min="1" placeholder="120" required />
				</div>
				<button type="button" class="btn btn-primary" id="add-to-shelf">Add to shelf</button>
				<button type="button" class="btn btn-ghost" id="add-cancel">Cancel</button>
			</form>
		</div>

		<nav class="filter-bar">
			<div class="filter-bar-inner">
				<button class="filter-tab active">All books <span class="count">6</span></button>
				<button class="filter-tab">Favorites <span class="count">3</span></button>
				<button class="filter-tab">Reading <span class="count">2</span></button>
				<button class="filter-tab">To be read <span class="count">4</span></button>
			</div>
		</nav>

		<main>
			<div class="shelf" id="shelf">
				<article class="book-card pinned reading">
					<div class="pin-border"></div>
					<div class="card-top">
						<button class="edit-btn">
							<i data-lucide="square-pen"></i>
						</button>
					</div>
					<div class="card-body">
						<h3 class="title">The Housekeeper and the Professor</h3>
						<p class="author"><span>by</span> Yoko Ogawa</p>
						<div class="progress-wrap">
							<div class="progress-label">
								Page
								<span class="page-editor">
									<button class="page-display" id="pageDisplay">67</button>
									<input type="number" class="current-page-input hidden" id="pageInput" value="67" min="0" max="180" />
								</span>
								of 180 pages
							</div>
							<div class="progress-bar"><div class="progress-bar-fill" style="width: 37%"></div></div>
						</div>
						<div class="card-actions">
							<button class="pin-btn">
								<i data-lucide="bookmark"></i>
							</button>
							<button class="done-btn">
								<i data-lucide="check"></i>
							</button>
							<button class="status-btn reading">Reading</button>
						</div>
					</div>
				</article>
			</div>
		</main>

		<script src="https://unpkg.com/lucide@latest"></script>
		<script src="script.js"></script>
	</body>
</html>
