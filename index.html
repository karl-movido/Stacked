<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Stacked</title>
	</head>
	<body>
		<header>
			<div class="brand">
				<div class="logo-icon"><img src="books.png" alt="books" /></div>
				<div class="logo-text">
					<h1>Stacked</h1>
					<p>Your reading library</p>
				</div>
			</div>
			<div class="header-actions">
				<div class="search-wrap">
					<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
						<title xmlns="">search-2-line</title>
						<g fill="none" fill-rule="evenodd">
							<path
								d="m12.593 23.258l-.011.002l-.071.035l-.02.004l-.014-.004l-.071-.035q-.016-.005-.024.005l-.004.01l-.017.428l.005.02l.01.013l.104.074l.015.004l.012-.004l.104-.074l.012-.016l.004-.017l-.017-.427q-.004-.016-.017-.018m.265-.113l-.013.002l-.185.093l-.01.01l-.003.011l.018.43l.005.012l.008.007l.201.093q.019.005.029-.008l.004-.014l-.034-.614q-.005-.018-.02-.022m-.715.002a.02.02 0 0 0-.027.006l-.006.014l-.034.614q.001.018.017.024l.015-.002l.201-.093l.01-.008l.004-.011l.017-.43l-.003-.012l-.01-.01z"
							/>
							<path
								fill="currentColor"
								d="M5 10a5 5 0 1 1 10 0a5 5 0 0 1-10 0m5-7a7 7 0 1 0 4.192 12.606l5.1 5.101a1 1 0 0 0 1.415-1.414l-5.1-5.1A7 7 0 0 0 10 3"
							/>
						</g>
					</svg>
					<input type="text" placeholder="Search title or author" />
				</div>
				<button class="btn btn-primary">
					<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
						<title xmlns="">add-line</title>
						<g fill="none">
							<path
								d="m12.593 23.258l-.011.002l-.071.035l-.02.004l-.014-.004l-.071-.035q-.016-.005-.024.005l-.004.01l-.017.428l.005.02l.01.013l.104.074l.015.004l.012-.004l.104-.074l.012-.016l.004-.017l-.017-.427q-.004-.016-.017-.018m.265-.113l-.013.002l-.185.093l-.01.01l-.003.011l.018.43l.005.012l.008.007l.201.093q.019.005.029-.008l.004-.014l-.034-.614q-.005-.018-.02-.022m-.715.002a.02.02 0 0 0-.027.006l-.006.014l-.034.614q.001.018.017.024l.015-.002l.201-.093l.01-.008l.004-.011l.017-.43l-.003-.012l-.01-.01z"
							/>
							<path
								fill="currentColor"
								d="M11 20a1 1 0 1 0 2 0v-7h7a1 1 0 1 0 0-2h-7V4a1 1 0 1 0-2 0v7H4a1 1 0 1 0 0 2h7z"
							/>
						</g>
					</svg>
					Add a book
				</button>
			</div>
		</header>

		<div class="add-panel">
			<form action="" class="add-panel-inner">
				<div class="field">
					<label for="titleInput">Title</label>
					<input type="text" id="titleInput" placeholder="e.g. Harry potter" required />
				</div>
				<div class="field">
					<label for="authorInput">Author</label>
					<input type="text" id="titleInput" placeholder="e.g. J.K. Rowling" required />
				</div>
				<div class="field">
					<label for="pagesInput">Pages</label>
					<input type="number" id="pagesInput" min="1" placeholder="364" required />
				</div>
				<button type="submit" class="btn btn-primary">Add to shelf</button>
				<button type="button" class="btn btn-ghost">Cancel</button>
			</form>
		</div>
	</body>
</html>
